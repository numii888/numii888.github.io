<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | DesignedDev Studio</title>
    <meta name="description" content="{{ page.title }} — DesignedDev Studio Blog">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        body { background-color: #0B0A0F; color: #F3F4F6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .neon-border-left { box-shadow: -8px 0 25px -5px rgba(147, 51, 234, 0.4); }
        .neon-border-right { box-shadow: 8px 0 25px -5px rgba(147, 51, 234, 0.4); }
        .post-content h2 { color: #ffffff; font-weight: 700; font-size: 1.5rem; margin-top: 2rem; margin-bottom: 0.75rem; }
        .post-content p { color: #9CA3AF; line-height: 1.75; margin-bottom: 1.25rem; }
        .post-content a { color: #a855f7; text-decoration: underline; }
        .post-content ul, .post-content ol { color: #9CA3AF; margin-bottom: 1.25rem; padding-left: 1.5rem; }
        .post-content li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="neon-border-left neon-border-right min-h-screen flex flex-col justify-between selection:bg-purple-600 selection:text-white">

    <header class="border-b border-purple-900/40 bg-black/60 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="https://i.ibb.co/Q7YddFdL/file-0000000082a08211be685e414e2c7915.png" class="w-8 h-8 object-contain rounded-lg" alt="DesignedDev Logo" onerror="this.style.display='none'; document.getElementById('header-text-fallback').style.display='block';">
            <span id="header-text-fallback" class="hidden w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center font-bold text-white text-sm shadow-[0_0_15px_rgba(147,51,234,0.5)]">DD</span>
            <a href="/index.html" class="font-bold tracking-tight text-lg text-white">DesignedDev<span class="text-purple-500"> Studio</span></a>
        </div>
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
            <a href="/index.html#services" class="hover:text-purple-400 transition">Services</a>
            <a href="/index.html#portfolio" class="hover:text-purple-400 transition">Portfolio</a>
            <a href="/index.html#pricing" class="hover:text-purple-400 transition">Pricing</a>
            <a href="/about.html" class="hover:text-purple-400 transition">About</a>
            <a href="/faq.html" class="hover:text-purple-400 transition">FAQ</a>
            <a href="/contact.html" class="hover:text-purple-400 transition">Contact</a>
            <a href="/blog.html" class="text-purple-400 transition">Blog</a>
        </nav>
        <a href="https://wa.me/923478868887" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold text-sm px-5 py-2.5 rounded-lg shadow-lg shadow-purple-600/30 transition">Order Now</a>
    </header>

    <article class="px-6 py-16 max-w-3xl mx-auto w-full">
        <a href="/blog.html" class="text-purple-400 text-sm font-semibold hover:underline mb-6 inline-block"><i class="fas fa-arrow-left mr-1"></i> Back to Blog</a>
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-3 leading-tight">{{ page.title }}</h1>
        <p class="text-gray-500 text-sm mb-10"><i class="far fa-calendar mr-1"></i> {{ page.date | date: "%B %d, %Y" }}</p>
        <div class="post-content">
            {{ content }}
        </div>
    </article>

    <section class="py-16 px-6 max-w-3xl mx-auto text-center border-t border-purple-950/40">
        <h2 class="text-2xl font-bold text-white mb-4">Ready to Start Your Project?</h2>
        <a href="https://wa.me/923478868887" target="_blank" class="bg-[#25D366] hover:bg-[#20ba56] text-white font-semibold px-8 py-3.5 rounded-lg transition inline-flex items-center gap-2"><i class="fab fa-whatsapp text-lg"></i> Contact WhatsApp</a>
    </section>

    <footer class="border-t border-purple-900/40 bg-black/60 px-6 py-8 text-center text-sm text-gray-500">
        <p>&copy; 2026 DesignedDev Studio. All rights reserved.</p>
    </footer>
</body>
</html>
