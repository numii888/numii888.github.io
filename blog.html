---
layout: default
title: Blog
---
<h1 style="padding: 40px; color: white;">Our Blog</h1>
<ul style="padding: 0 40px; list-style: none;">
  {% for post in site.posts %}
    <li style="margin-bottom: 20px;">
      <a href="{{ post.url }}" style="color: #a855f7; font-size: 20px; text-decoration: none;">{{ post.title }}</a>
      <p style="color: #ccc; margin: 5px 0;">{{ post.date | date: "%B %d, %Y" }}</p>
    </li>
  {% endfor %}
</ul>
